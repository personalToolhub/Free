<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ToolBox by Uzair Elahi — Free Forever</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;700&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/piexifjs/1.0.6/piexif.js"></script>
<style>
  :root{
    --bg-grad:linear-gradient(160deg,#EEF2FF 0%,#FDF2FF 45%,#FFF7ED 100%);
    --surface:#FFFFFF; --surface2:#FFFFFF;
    --violet:#6D5DFC; --violet-dark:#4B3FD1;
    --cyan:#06B6D4; --cyan-dark:#0E7490;
    --pink:#EC4899; --pink-dark:#BE185D;
    --text:#211D3A; --muted:#6B7280; --line:#E7E3FB;
    --input-bg:#F9F8FF; --input-border:#C9C2F5; --badge-bg:#EDE9FE;
    --close-bg:#F3F1FF; --card-border:#fff; --overlay-bg:rgba(33,29,58,.35);
    --card-glow-op:.35;
  }
  [data-theme="dark"]{
    --bg-grad:#0B0B14;
    --surface:#14141f; --surface2:#1c1c2b;
    --violet:#7C5CFC; --violet-dark:#A796FF;
    --cyan:#29E7CD; --cyan-dark:#29E7CD;
    --pink:#FF4FA3; --pink-dark:#FF4FA3;
    --text:#F1F0FF; --muted:#8B88A8; --line:#2a2a3d;
    --input-bg:#0d0d18; --input-border:#3a3a55; --badge-bg:#1c1c2b;
    --close-bg:#161623; --card-border:transparent; --overlay-bg:rgba(5,5,10,.7);
    --card-glow-op:.6;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{margin:0; background:var(--bg-grad); background-attachment:fixed; color:var(--text); font-family:'Inter',sans-serif; overflow-x:hidden; transition:background .3s, color .3s;}
  h1,h2,h3,.disp{font-family:'Fredoka',sans-serif;}

  .blob{position:fixed; border-radius:50%; filter:blur(100px); opacity:.35; z-index:0; pointer-events:none; animation:float 14s ease-in-out infinite;}
  .blob1{width:420px;height:420px;background:var(--violet);top:-120px;left:-100px;}
  .blob2{width:380px;height:380px;background:var(--cyan);bottom:-140px;right:-80px;animation-delay:3s;}
  .blob3{width:300px;height:300px;background:var(--pink);top:40%;left:60%;animation-delay:6s;}
  @keyframes float{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(40px,-30px) scale(1.1);}}

  /* ticker */
  .ticker{position:relative; z-index:5; width:100%; overflow:hidden; background:linear-gradient(90deg,var(--pink),var(--violet)); padding:12px 0; box-shadow:0 2px 12px rgba(109,93,252,.25);}
  .ticker-track{display:flex; width:max-content; animation:scroll 18s linear infinite; white-space:nowrap;}
  .ticker-track span{font-family:'Fredoka',sans-serif; font-weight:600; font-size:15px; letter-spacing:.04em; text-transform:uppercase; color:#fff; padding:0 14px;}
  @keyframes scroll{from{transform:translateX(0);}to{transform:translateX(-50%);}}

  /* top bar */
  .topbar{position:sticky; top:0; z-index:30; display:flex; justify-content:space-between; align-items:center; padding:14px 18px;}
  .avatar-btn{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--violet),var(--pink));border:2px solid var(--surface);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;font-weight:700;font-family:'Fredoka',sans-serif;font-size:16px;overflow:hidden;transition:.2s;box-shadow:0 3px 10px rgba(109,93,252,.4);animation:avatarpulse 2.4s ease-in-out infinite;}
  .avatar-btn:hover{transform:scale(1.1) rotate(-6deg);}
  .avatar-btn img{width:100%;height:100%;object-fit:cover;}
  @keyframes avatarpulse{0%,100%{box-shadow:0 3px 10px rgba(109,93,252,.4);}50%{box-shadow:0 3px 20px rgba(109,93,252,.15);}}
  .icon-btn{width:36px;height:36px;background:none;border:none;color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.2s;opacity:.75;}
  .icon-btn:hover{opacity:1; color:var(--violet); transform:scale(1.1);}
  #themeBtn{background:var(--text); color:var(--surface); border-radius:50%; opacity:1; font-size:15px; box-shadow:0 2px 8px rgba(0,0,0,.15); transition:background .3s, color .3s, transform .2s;}
  #themeBtn:hover{color:var(--surface); transform:scale(1.12) rotate(15deg);}
  .searchdrop{max-width:1100px;margin:0 auto;padding:0 18px;overflow:hidden;max-height:0;transition:max-height .25s ease;}
  .searchdrop.open{max-height:70px;}
  .searchdrop input{width:100%;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--text);font-size:14px;outline:none;margin:8px auto 4px;max-width:1100px;display:block;box-shadow:0 2px 8px rgba(109,93,252,.08);}
  .searchdrop input:focus{border-color:var(--cyan);}
  #searchResults{display:none;}

  header{position:relative; z-index:2; text-align:center; padding:40px 20px 30px;}
  .createdby-pill{position:relative; display:inline-block; padding:14px 30px; border-radius:999px; color:var(--muted); font-size:17px; margin-bottom:26px; cursor:pointer; background:var(--surface); border:1px solid var(--line); transition:transform .2s; box-shadow:0 4px 14px rgba(109,93,252,.14);}
  .createdby-pill:hover{transform:scale(1.05);}
  .createdby-pill b{color:var(--pink-dark);}
  .typewriter{display:inline-block; overflow:hidden; white-space:nowrap; border-right:2px solid var(--cyan); animation:typing 2.2s steps(24) 1 forwards, blinkCaret .7s step-end infinite, glowPulse 2.2s ease-in-out infinite; max-width:26ch;}
  @keyframes typing{0%{max-width:0;}100%{max-width:26ch;}}
  @keyframes blinkCaret{50%{border-color:transparent;}}
  @keyframes glowPulse{0%,100%{text-shadow:0 0 6px rgba(6,182,212,.35);}50%{text-shadow:0 0 10px rgba(236,72,153,.4);}}
  header h1{font-size:clamp(38px,9vw,68px); font-weight:700; line-height:1.08; margin:0 0 18px;}
  header h1 span{display:block;}
  header h1 .line1{color:var(--violet);}
  header h1 .line2{background:linear-gradient(90deg,var(--violet) 45%,var(--pink) 90%); -webkit-background-clip:text; background-clip:text; color:transparent;}
  header p{color:var(--muted); font-size:17px; max-width:560px; margin:0 auto; line-height:1.5;}
  .navpills{display:flex; gap:12px; flex-wrap:wrap; justify-content:center; margin-top:28px;}
  .navpills button{font-family:'Fredoka',sans-serif; font-size:15px; font-weight:600; padding:8px 22px 8px 8px; border-radius:999px; background:var(--surface); border:1px solid var(--line); color:var(--text); cursor:pointer; transition:.2s; display:flex; align-items:center; gap:10px; animation:pillglow 3s ease-in-out infinite;}
  @keyframes pillglow{0%,100%{box-shadow:0 2px 8px rgba(109,93,252,.1);}50%{box-shadow:0 4px 18px rgba(109,93,252,.28);}}
  .navpills button:hover{border-color:var(--violet); transform:translateY(-2px);}
  .navpills .badge{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;}
  .credit{display:none;}

  main{position:relative; z-index:2; max-width:1100px; margin:0 auto; padding:10px 20px 80px;}
  .section{margin-top:46px;}
  .section h2{font-size:22px; display:flex; align-items:center; gap:10px; margin-bottom:16px; font-weight:700;}
  .section h2 .heading-text{background:linear-gradient(90deg,var(--cyan-dark),var(--violet),var(--pink-dark),var(--cyan-dark)); background-size:300% auto; -webkit-background-clip:text; background-clip:text; color:transparent; animation:shine 4s linear infinite;}
  .section h2 .cat-icon{display:inline-block; animation:bouncey 2s ease-in-out infinite;}
  @keyframes bouncey{0%,100%{transform:translateY(0) rotate(0);}50%{transform:translateY(-5px) rotate(-8deg);}}
  .dot{width:10px;height:10px;border-radius:50%;background:linear-gradient(90deg,var(--violet),var(--cyan)); animation:dotpulse 1.5s ease-in-out infinite;}
  @keyframes dotpulse{0%,100%{transform:scale(1); opacity:1;}50%{transform:scale(1.5); opacity:.5;}}

  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:14px;}
  .card{position:relative; background:var(--surface); border:2px solid var(--card-border); border-radius:16px; padding:18px 14px; cursor:pointer; text-align:center; overflow:hidden; transition:transform .25s cubic-bezier(.34,1.56,.64,1), background .3s; box-shadow:0 4px 16px rgba(109,93,252,.1);}
  .card::after{content:""; position:absolute; inset:-6px; z-index:-1; border-radius:20px; background:conic-gradient(from 0deg,var(--violet),var(--cyan),var(--pink),var(--violet)); filter:blur(16px); opacity:var(--card-glow-op); animation:neonspin 4s linear infinite;}
  .card::before{content:""; position:absolute; inset:0; opacity:0; transition:.3s; background:linear-gradient(135deg,var(--violet),var(--cyan),var(--pink)); z-index:0;}
  @keyframes borderflow{0%{background-position:0% 50%;}100%{background-position:300% 50%;}}
  @keyframes shine{to{background-position:300% center;}}
  .card:hover{transform:translateY(-6px) scale(1.05) rotate(-1deg); box-shadow:0 10px 26px rgba(109,93,252,.22);}
  .card:hover::before{opacity:.1;}
  .card:hover .ic{animation:wiggle .5s ease;}
  @keyframes wiggle{0%,100%{transform:rotate(0);}25%{transform:rotate(-12deg) scale(1.15);}75%{transform:rotate(12deg) scale(1.15);}}
  .card.active{animation:pop .35s ease;}
  @keyframes pop{50%{transform:scale(.9) rotate(3deg);}}
  .card .ic{font-size:28px; display:block; margin-bottom:8px; position:relative; z-index:1; transition:transform .2s;}
  .card .nm{font-size:13px; font-weight:600; position:relative; z-index:1; line-height:1.3; color:var(--text);}
  .card .heart{position:absolute; top:6px; left:6px; z-index:2; font-size:15px; background:none; border:none; cursor:pointer; opacity:.55; transition:transform .15s, opacity .15s;}
  .card .heart:hover{transform:scale(1.3);}
  .card .heart.faved{opacity:1; filter:drop-shadow(0 0 4px var(--pink)); animation:heartbeat .4s ease;}
  @keyframes heartbeat{0%{transform:scale(1);}30%{transform:scale(1.5);}60%{transform:scale(.9);}100%{transform:scale(1);}}
  .card .ext{position:absolute; top:6px; right:6px; font-size:9px; background:var(--badge-bg); border:1px solid var(--line); color:var(--violet-dark); padding:2px 6px; border-radius:6px; font-weight:700; z-index:1;}
  .card.hidden{display:none;}
  .empty-fav{color:var(--muted); font-size:13px;}

  .overlay{position:fixed; inset:0; background:var(--overlay-bg); backdrop-filter:blur(4px); display:none; align-items:center; justify-content:center; z-index:100; padding:16px;}
  .overlay.show{display:flex;}
  .modal{background:var(--surface2); border:1px solid var(--line); border-radius:20px; width:100%; max-width:560px; max-height:88vh; overflow-y:auto; padding:26px; animation:rise .25s ease; box-shadow:0 20px 60px rgba(33,29,58,.25);}
  .modal.modal-full{max-width:100vw; width:100vw; height:100vh; max-height:100vh; border-radius:0; margin:0;}
  .modal.modal-embed{padding:0; overflow:hidden;}
  .modal.modal-embed iframe{width:100%; height:100%; border:none; display:block; background:#fff;}
  .modal.modal-embed .close{position:absolute; top:10px; right:10px; z-index:5; box-shadow:0 2px 10px rgba(0,0,0,.25);}
  .overlay:has(.modal-full){padding:0; align-items:stretch;}
  .timerbar{height:6px; background:var(--line); border-radius:4px; overflow:hidden; margin:6px 0;}
  .timerbar div{height:100%; background:linear-gradient(90deg,var(--cyan),var(--pink)); transition:width 1s linear;}
  .pulse-token{animation:tokenpulse .6s ease-in-out infinite;}
  @keyframes tokenpulse{0%,100%{transform:translate(-50%,-50%) scale(1);}50%{transform:translate(-50%,-50%) scale(1.35);}}
  .chatbox{margin-top:10px; border:1px solid var(--line); border-radius:10px; background:var(--input-bg);}
  .chatlog{height:110px; overflow-y:auto; padding:8px; font-size:12px;}
  .chatlog div{margin-bottom:4px;}
  .chatrow{display:flex; gap:6px; padding:6px; border-top:1px solid var(--line);}
  .chatrow input{flex:1; padding:6px 10px; border-radius:8px; border:1px solid var(--line); background:var(--surface); color:var(--text); font-size:13px; outline:none;}
  .chatrow button{padding:6px 12px; border-radius:8px; border:none; background:var(--violet); color:#fff; font-size:13px; cursor:pointer;}
  @keyframes rise{from{transform:translateY(24px); opacity:0;}to{transform:translateY(0); opacity:1;}}
  .modal h3{margin:0 0 6px; font-size:20px;}
  .modal .desc{color:var(--muted); font-size:13px; margin-bottom:18px;}
  .modal .close{float:right; background:var(--close-bg); border:1px solid var(--line); color:var(--text); width:32px; height:32px; border-radius:10px; cursor:pointer; font-size:16px;}
  .modal label{display:block; font-size:12px; color:var(--muted); margin:14px 0 6px;}
  .modal input[type=text], .modal input[type=number], .modal select, .modal textarea{width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--line); background:var(--input-bg); color:var(--text); font-size:14px; outline:none;}
  .modal input[type=file]{width:100%; padding:10px; border-radius:10px; border:1px dashed var(--input-border); background:var(--input-bg); color:var(--muted);}
  .btn{position:relative; margin-top:16px; width:100%; padding:14px; border:none; border-radius:14px; cursor:pointer; font-weight:700; font-size:14px; color:#fff; background:linear-gradient(135deg,var(--violet),var(--pink)); box-shadow:0 5px 0 var(--pink-dark), 0 8px 18px rgba(109,93,252,.3); transition:transform .12s, box-shadow .12s; display:block; text-align:center; text-decoration:none;}
  .btn:hover{transform:translateY(-2px); box-shadow:0 7px 0 var(--pink-dark), 0 12px 22px rgba(109,93,252,.35);}
  .btn:active{transform:translateY(3px); box-shadow:0 2px 0 var(--pink-dark);}
  .btn.secondary{background:var(--surface); color:var(--violet-dark); box-shadow:0 5px 0 var(--line), 0 4px 10px rgba(109,93,252,.08); margin-top:8px;}
  .result{margin-top:16px; font-size:13px; color:var(--cyan-dark); font-weight:600;}
  .previewbox{margin-top:12px; text-align:center;}
  .previewbox img, .previewbox canvas{max-width:100%; border-radius:10px; border:1px solid var(--line);}
  .row2{display:flex; gap:10px;}
  .row2>*{flex:1;}
  .meterbar{height:10px; background:var(--badge-bg); border-radius:6px; overflow:hidden; margin-top:10px;}
  .meterbar div{height:100%; width:0%; background:linear-gradient(90deg,var(--cyan),var(--pink)); transition:width .1s;}
  .modetabs{display:flex; gap:8px; margin-top:10px;}
  .modetabs button{flex:1; padding:8px; border-radius:10px; border:1px solid var(--line); background:var(--input-bg); color:var(--muted); cursor:pointer; font-size:13px;}
  .modetabs button.on{background:linear-gradient(90deg,var(--violet),var(--pink)); color:#fff; border-color:transparent;}

  footer{text-align:center; padding:30px; font-size:15px; position:relative; z-index:2;}
  .footer-anim{font-family:'Fredoka',sans-serif; font-weight:600; font-size:16px; background:linear-gradient(90deg,var(--cyan-dark),var(--violet),var(--pink-dark),var(--cyan-dark)); background-size:300% auto; -webkit-background-clip:text; background-clip:text; color:transparent; animation:shine 5s linear infinite;}
  .fh{display:inline-block; animation:heartbeat 1.2s ease-in-out infinite;}

  /* ---------- Temp Mail ---------- */
  .tm-wrap{max-width:520px; margin:0 auto;}
  .tm-top{position:relative; border-radius:16px; padding:2px; background:linear-gradient(120deg,var(--violet),var(--cyan),var(--pink),var(--violet)); background-size:300% 300%; animation:tmGlow 6s ease infinite;}
  @keyframes tmGlow{0%{background-position:0% 50%;}50%{background-position:100% 50%;}100%{background-position:0% 50%;}}
  .tm-top-inner{background:var(--surface2); border-radius:14px; padding:16px;}
  .tm-live{display:flex; align-items:center; gap:6px; font-size:11px; color:var(--muted); font-weight:600; letter-spacing:.03em; text-transform:uppercase; margin-bottom:10px;}
  .tm-dot{width:7px; height:7px; border-radius:50%; background:#22c55e; box-shadow:0 0 0 0 rgba(34,197,94,.6); animation:tmPulse 1.8s ease-out infinite;}
  .tm-dot.off{background:var(--muted); animation:none;}
  @keyframes tmPulse{0%{box-shadow:0 0 0 0 rgba(34,197,94,.55);}70%{box-shadow:0 0 0 8px rgba(34,197,94,0);}100%{box-shadow:0 0 0 0 rgba(34,197,94,0);}}
  .tm-addrrow{display:flex; align-items:center; gap:8px; background:var(--input-bg); border:1px solid var(--input-border); border-radius:11px; padding:12px 12px;}
  .tm-addrrow input{flex:1; min-width:0; border:none; background:transparent; outline:none; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:14px; color:var(--text);}
  .tm-iconbtn{flex-shrink:0; border:none; width:36px; height:36px; border-radius:9px; background:linear-gradient(135deg,var(--violet),var(--pink)); color:#fff; cursor:pointer; font-size:14px; display:flex; align-items:center; justify-content:center; transition:transform .12s;}
  .tm-iconbtn:active{transform:scale(.88);}
  .tm-iconbtn.copied{background:linear-gradient(135deg,#22c55e,#16a34a);}
  .tm-actions{display:flex; gap:10px; margin-top:12px;}
  .tm-actions .btn{margin-top:0;}
  .tm-otp{max-height:0; opacity:0; overflow:hidden; transition:max-height .35s ease, opacity .3s ease, margin .35s ease; margin-top:0; border-radius:12px;}
  .tm-otp.show{max-height:120px; opacity:1; margin-top:14px;}
  .tm-otp-inner{background:linear-gradient(135deg,rgba(34,197,94,.13),rgba(34,197,94,.05)); border:1px solid rgba(34,197,94,.4); border-radius:12px; padding:12px 14px;}
  .tm-otp-lbl{font-size:10.5px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:#16a34a; margin:0 0 4px;}
  .tm-otp-code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:26px; font-weight:800; letter-spacing:4px; color:var(--text); animation:tmOtpIn .3s ease;}
  @keyframes tmOtpIn{from{transform:scale(.85); opacity:0;}to{transform:scale(1); opacity:1;}}
  .tm-inbox{margin-top:18px;}
  .tm-inbox-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;}
  .tm-inbox-head span{font-size:11px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--muted);}
  .tm-empty{text-align:center; padding:36px 14px; color:var(--muted); font-size:13px; line-height:1.6;}
  .tm-empty .tm-emoji{font-size:30px; display:block; margin-bottom:8px;}
  .tm-msg{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px 13px; margin-bottom:9px; cursor:pointer; animation:tmSlideIn .35s ease; transition:border-color .15s, box-shadow .15s;}
  .tm-msg:hover{border-color:var(--violet); box-shadow:0 4px 14px rgba(109,93,252,.12);}
  @keyframes tmSlideIn{from{transform:translateY(-8px); opacity:0;}to{transform:translateY(0); opacity:1;}}
  .tm-msg-top{display:flex; justify-content:space-between; gap:8px;}
  .tm-msg-from{font-size:13.5px; font-weight:700; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .tm-msg-time{font-size:11px; color:var(--muted); white-space:nowrap; flex-shrink:0;}
  .tm-msg-subj{font-size:12.5px; color:var(--muted); margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .tm-msg-body{font-size:12.5px; color:var(--muted); line-height:1.55; margin-top:9px; white-space:pre-wrap; display:none; border-top:1px dashed var(--line); padding-top:9px;}
  .tm-msg.open .tm-msg-body{display:block;}
  .tm-msg-actions{display:flex; justify-content:flex-end; margin-top:6px;}
  .tm-del{border:none; background:none; color:var(--pink-dark); font-size:11.5px; font-weight:700; cursor:pointer; padding:3px 4px;}
  .tm-status{text-align:center; font-size:11.5px; color:var(--muted); margin-top:12px; min-height:14px;}
  .tm-status.err{color:var(--pink-dark);}

  /* ---------- Passport Photo Sheet ---------- */
  .pp-wrap{max-width:520px; margin:0 auto;}
  .pp-controls{display:flex; gap:10px; margin-bottom:14px;}
  .pp-controls>*{flex:1;}
  .pp-count{text-align:center; font-size:12px; color:var(--muted); margin-bottom:10px;}
  .pp-count b{color:var(--violet-dark);}
  .pp-sheet-outer{background:repeating-linear-gradient(45deg,var(--input-bg),var(--input-bg) 10px,var(--surface) 10px,var(--surface) 20px); border-radius:14px; padding:14px; display:flex; justify-content:center;}
  .pp-sheet{background:#fff; box-shadow:0 6px 24px rgba(33,29,58,.18); display:grid; gap:3px; touch-action:none; user-select:none;}
  .pp-cell{position:relative; border:1px dashed #c9c2d9; background-size:cover; background-position:center; overflow:hidden;}
  .pp-cell.filled{border:1px solid var(--violet);}
  .pp-cell::after{content:"+"; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#c9c2d9; font-size:18px; font-weight:300;}
  .pp-cell.filled::after{content:""; }
  .pp-hint{text-align:center; font-size:11.5px; color:var(--muted); margin-top:10px; line-height:1.5;}
  .pp-cell{animation:ppIn .2s ease;}
  @keyframes ppIn{from{transform:scale(.9);}to{transform:scale(1);}}
</style>
</head>
<body>

<script>
/* ---------- click sound ---------- */
let actx;
function pop(freq=520){
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type='sine'; o.frequency.setValueAtTime(freq, actx.currentTime);
    o.frequency.exponentialRampToValueAtTime(freq*1.6, actx.currentTime+0.08);
    g.gain.setValueAtTime(0.18, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime+0.15);
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime+0.16);
  }catch(e){}
}

/* ---------- theme toggle ---------- */
function applyTheme(theme){
  if(theme==='dark'){ document.documentElement.setAttribute('data-theme','dark'); document.getElementById('themeBtn').textContent='🌙'; }
  else { document.documentElement.removeAttribute('data-theme'); document.getElementById('themeBtn').textContent='☀️'; }
}
function toggleTheme(){
  pop(800);
  const isDark = document.documentElement.getAttribute('data-theme')==='dark';
  const next = isDark ? 'light' : 'dark';
  applyTheme(next);
  try{ localStorage.setItem('toolbox_theme', next); }catch(e){}
}
(function(){
  try{ applyTheme(localStorage.getItem('toolbox_theme') || 'light'); }catch(e){}
})();

/* ---------- avatar refresh (funny sound) ---------- */
function funReload(){
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type='square'; o.frequency.setValueAtTime(600, actx.currentTime);
    o.frequency.exponentialRampToValueAtTime(80, actx.currentTime+0.35);
    g.gain.setValueAtTime(0.2, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime+0.4);
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime+0.4);
  }catch(e){}
  setTimeout(()=>location.reload(), 250);
}

/* ---------- search dropdown ---------- */
function toggleSearch(){
  pop(700);
  const d = document.getElementById('searchdrop');
  d.classList.toggle('open');
  if(d.classList.contains('open')) setTimeout(()=>document.getElementById('search').focus(), 150);
  else { document.getElementById('search').value=''; runSearch(''); }
}

/* ---------- favorites (saved in this browser) ---------- */
function getFavs(){ try{ return JSON.parse(localStorage.getItem('toolbox_favs')||'[]'); }catch(e){ return []; } }
function setFavs(arr){ try{ localStorage.setItem('toolbox_favs', JSON.stringify(arr)); }catch(e){} }
function favChime(){
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    [660, 990].forEach((f,i)=>{
      const o = actx.createOscillator(), g = actx.createGain();
      o.type='triangle'; o.frequency.value = f;
      g.gain.setValueAtTime(0.001, actx.currentTime + i*0.09);
      g.gain.linearRampToValueAtTime(0.2, actx.currentTime + i*0.09 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + i*0.09 + 0.18);
      o.connect(g); g.connect(actx.destination);
      o.start(actx.currentTime + i*0.09); o.stop(actx.currentTime + i*0.09 + 0.2);
    });
  }catch(e){}
}
function toggleFav(id, e){
  e.stopPropagation(); favChime();
  let favs = getFavs();
  favs = favs.includes(id) ? favs.filter(x=>x!==id) : [...favs, id];
  setFavs(favs);
  renderAll();
}

/* ---------- tool data ----------

*/
const categories = [

/* ---------- render ---------- */
function makeCard(t){
  const favs = getFavs();
  const c = document.createElement('div');
  c.className='card';
  c.dataset.name = t.name.toLowerCase();
  const isFav = favs.includes(t.id);
  c.innerHTML = `
    <button class="heart ${isFav?'faved':''}" onclick="toggleFav('${t.id}', event)">${isFav?'❤️':'🤍'}</button>
    ${t.type==='link'?'<span class="ext">OPENS SITE</span>':''}
    ${t.type==='soon'?'<span class="ext">SOON</span>':''}
    <span class="ic">${t.icon}</span><span class="nm">${t.name}</span>`;
  c.onclick = ()=>{ pop(); c.classList.remove('active'); void c.offsetWidth; c.classList.add('active'); openTool(t); };
  return c;
}
function renderAll(){
  const main = document.getElementById('main');
  main.innerHTML = '';
  const favs = getFavs();
  categories.forEach(cat=>{
    let tools = cat.key==='favs' ? allTools.filter(t=>favs.includes(t.id)) : cat.tools;
    if(cat.key==='favs' && tools.length===0) return; // hide empty favourites section
    const sec = document.createElement('div');
    sec.className='section';
    sec.id = 'cat-' + (cat.key || cat.name.toLowerCase().replace(/[^a-z]+/g,'-'));
    sec.innerHTML = `<h2><span class="dot"></span><span class="cat-icon">${cat.icon}</span><span class="heading-text">${cat.name}</span></h2>`;
    const grid = document.createElement('div');
    grid.className='grid';
    tools.forEach(t=>grid.appendChild(makeCard(t)));
    sec.appendChild(grid);
    main.appendChild(sec);
  });
}
renderAll();
buildNavPills();
function buildNavPills(){
  const wrap = document.getElementById('navpills');
  wrap.innerHTML = '';
  const pills = [
    { icon:'🖼️', label:'Photo', target:'Photo & PDF tools', bg:'#FFE8CC' },

    { icon:'🎬', label:'Movies', target:'Movies', bg:'#EDE4FF' },

  pills.forEach(p=>{
    const id = 'cat-' + p.target.toLowerCase().replace(/[^a-z]+/g,'-');

    b.onclick = ()=>{ pop(600); document.getElementById(id)?.scrollIntoView({behavior:'smooth', block:'start'}); };
    wrap.appendChild(b);

}

/* ---------- search: focused results mode ---------- */
function runSearch(q){
  q = q.toLowerCase().trim();
  const ticker = document.querySelector('.ticker');
  const hero = document.getElementById('heroHeader');
  const main = document.getElementById('main');
  const results = document.getElementById('searchResults');
  if(!q){
    if(ticker) ticker.style.display='';
    hero.style.display='';
    main.style.display='';
    results.style.display='none';
    results.innerHTML='';
    return;
  }
  if(ticker) ticker.style.display='none';
  hero.style.display='none';
  main.style.display='none';
  results.style.display='block';
  const matches = allTools.filter(t=>t.name.toLowerCase().includes(q));
  results.innerHTML = matches.length ? '' : `<p style="text-align:center;color:var(--muted);padding:30px;">No tools found for "${q}"</p>`;
  if(matches.length){
    const grid = document.createElement('div');
    grid.className='grid';
    grid.style.maxWidth='1100px'; grid.style.margin='16px auto'; grid.style.padding='0 20px';
    matches.forEach(t=>grid.appendChild(makeCard(t)));
    results.appendChild(grid);
  }
}
document.getElementById('search').addEventListener('input', e=>runSearch(e.target.value));

/* ---------- modal core ---------- */
const overlay = document.getElementById('overlay');
const modalBody = document.getElementById('modalBody');
function closeModal(){
  pop(300); overlay.classList.remove('show'); modalBody.innerHTML='';
  document.getElementById('modal')?.classList.remove('modal-embed');
  if(typeof tmStopPolling==='function') tmStopPolling();
}
overlay.addEventListener('click', e=>{ if(e.target===overlay) closeModal(); });

function openTool(t){
  overlay.classList.add('show');
  const modalEl = document.getElementById('modal');
  modalEl.classList.toggle('modal-full', !!t.big);
  modalEl.classList.toggle('modal-embed', t.type==='embed');
  if(!t.big) modalEl.style.maxWidth = '560px';
  if(t.type==='soon'){
    modalBody.innerHTML = `<h3>${t.icon} ${t.name}</h3>
      <p class="desc">This game is bigger to build properly (real rules + AI + animations), so it's not wired up yet — coming in the next update! 🚧</p>`;
    return;
  }
  if(t.type==='link'){
    modalBody.innerHTML = `<h3>${t.icon} ${t.name}</h3>
      <p class="desc">This job needs a bigger backend than a free static page can run, so it opens a trusted free tool for it instead — nothing downloads or signs up on your behalf.</p>
      ${t.extra ? `<p class="result">${t.extra}</p>` : ''}
      <a class="btn" href="${t.url}" target="_blank" rel="noopener">Open free tool ↗</a>`;
    return;
  }
  modalBody.innerHTML = renderers[t.id] ? renderers[t.id]() : `<h3>${t.name}</h3><p class="desc">Tool loading…</p>`;
  if(initializers[t.id]) initializers[t.id]();
}

/* ----- Photo to PDF ----- */
function doPhoto2Pdf(){
  const files = document.getElementById('p2p_files').files;
  if(!files.length) return document.getElementById('p2p_result').innerText = 'Pick at least one image.';
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  let loaded = 0;
  const imgs = [...files];
  const readNext = (i)=>{
    if(i>0) doc.addPage();
    const reader = new FileReader();
    reader.onload = ev=>{
      const img = new Image();
      img.onload = ()=>{
        const pw = doc.internal.pageSize.getWidth(), ph = doc.internal.pageSize.getHeight();
        const ratio = Math.min(pw/img.width, ph/img.height);
        const w = img.width*ratio, h = img.height*ratio;
        doc.addImage(img, 'JPEG', (pw-w)/2, (ph-h)/2, w, h);
        loaded++;
        if(loaded < imgs.length) readNext(loaded);
        else { doc.save('photos.pdf'); document.getElementById('p2p_result').innerText = 'Done — PDF downloaded ✅'; }
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(imgs[i]);
  };
  readNext(0);
}

let msDataUrl = null;
function msInit(){
  msDataUrl = null;

        const TW = 3024, TH = 4032;

        canvas.width = TW; canvas.height = TH;
        const ctx = canvas.getContext('2d');
        const scale = Math.max(TW/img.width, TH/img.height);
        const sw = TW/scale, sh = TH/scale;
        const sx = (img.width - sw)/2, sy = (img.height - sh)/2;
        ctx.drawImage(img, sx, sy, sw, sh, 0, 0, TW, TH);
        let dataUrl = canvas.toDataURL('image/jpeg', 0.95);
        try{
          const now = new Date();
          const pad = n=>String(n).padStart(2,'0');
          const dt = `${now.getFullYear()}:${pad(now.getMonth()+1)}:${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;

          zeroth[piexif.ImageIFD.Software] = "Meta AI";
          zeroth[piexif.ImageIFD.DateTime] = dt;
          const exifIFD = {};
          exifIFD[piexif.ExifIFD.DateTimeOriginal] = dt;
          exifIFD[piexif.ExifIFD.DateTimeDigitized] = dt;
          const exifObj = {"0th":zeroth, "Exif":exifIFD};
          const exifBytes = piexif.dump(exifObj);
          dataUrl = piexif.insert(exifBytes, dataUrl);
        }catch(err){ console.error('EXIF injection failed', err); }
        msDataUrl = dataUrl;

/* ----- PDF Merge ----- */
async function doPdfMerge(){
  const files = document.getElementById('pm_files').files;
  if(files.length < 2) return document.getElementById('pm_result').innerText = 'Pick at least 2 PDFs.';
  const { PDFDocument } = PDFLib;
  const merged = await PDFDocument.create();
  for(const f of files){
    const bytes = await f.arrayBuffer();
    const src = await PDFDocument.load(bytes);
    const pages = await merged.copyPages(src, src.getPageIndices());
    pages.forEach(p=>merged.addPage(p));
  }
  const bytes = await merged.save();
  const blob = new Blob([bytes], {type:'application/pdf'});
  const url = URL.createObjectURL(blob);
  document.getElementById('pm_result').innerHTML = `Merged ✅ <a class="btn" href="${url}" download="merged.pdf">Download merged.pdf</a>`;
}

/* ----- Text to Handwriting ----- */
function doHandwriting(){
  const text = document.getElementById('hw_text').value;
  const style = document.getElementById('hw_page').value;
  const color = document.getElementById('hw_color_picker').value;
  const canvas = document.createElement('canvas');
  canvas.width = 800; canvas.height = 1000;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#fdfcf5'; ctx.fillRect(0,0,canvas.width,canvas.height);
  const lineH = 42, startY = 80, marginX = 60;
  if(style==='ruled'){
    ctx.strokeStyle = '#c9d6ff'; ctx.lineWidth = 1;
    for(let y=startY-20; y<canvas.height-30; y+=lineH){
      ctx.beginPath(); ctx.moveTo(30,y); ctx.lineTo(canvas.width-30,y); ctx.stroke();
    }
    ctx.strokeStyle = '#f3a3a3';
    ctx.beginPath(); ctx.moveTo(marginX-20,20); ctx.lineTo(marginX-20,canvas.height-20); ctx.stroke();
  }
  ctx.fillStyle = color;
  ctx.font = "32px 'Caveat', cursive";
  const words = text.split(/\s+/);
  let line = '', y = startY, x = marginX;
  const maxW = canvas.width - marginX - 40;
  words.forEach(w=>{
    const test = line + w + ' ';
    if(ctx.measureText(test).width > maxW){
      ctx.fillText(line, x, y); line = w + ' '; y += lineH;
    } else line = test;
  });
  ctx.fillText(line, x, y);
  document.getElementById('hw_preview').innerHTML = '';
  document.getElementById('hw_preview').appendChild(canvas);
  const dl = document.createElement('a');
  dl.className='btn'; dl.innerText='Download image';
  dl.href = canvas.toDataURL('image/png'); dl.download='handwriting.png';
  document.getElementById('hw_preview').appendChild(dl);
}

/* ----- Speaker Cleaner ----- */
function playSweep(){
  actx = actx || new (window.AudioContext||window.webkitAudioContext)();
  const o = actx.createOscillator(), g = actx.createGain();
  o.type='sine'; o.frequency.setValueAtTime(150, actx.currentTime);
  o.frequency.linearRampToValueAtTime(18000, actx.currentTime+7);
  o.frequency.linearRampToValueAtTime(150, actx.currentTime+14);
  g.gain.setValueAtTime(0.5, actx.currentTime);
  o.connect(g); g.connect(actx.destination);
  o.start(); o.stop(actx.currentTime+15);
  document.getElementById('sc_result').innerText = 'Playing... keep speaker facing down.';
  setTimeout(()=>document.getElementById('sc_result').innerText='Done ✅', 15000);
}

/* ----- Mic Test ----- */
function startMicTest(){
  navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{
    const ac = new (window.AudioContext||window.webkitAudioContext)();
    const src = ac.createMediaStreamSource(stream);
    const analyser = ac.createAnalyser(); analyser.fftSize=256;
    src.connect(analyser);
    const data = new Uint8Array(analyser.frequencyBinCount);
    document.getElementById('mic_result').innerText = 'Listening… speak now 🎙️';
    function tick(){
      analyser.getByteFrequencyData(data);
      const avg = data.reduce((a,b)=>a+b,0)/data.length;
      document.getElementById('mic_bar').style.width = Math.min(100, avg*1.5)+'%';
      requestAnimationFrame(tick);
    }
    tick();
  }).catch(()=>{ document.getElementById('mic_result').innerText = 'Mic access denied or unavailable.'; });
}

let compassMode = 'compass';
let qiblaBearing = null;
function setCompassMode(mode){
  pop(650);
  compassMode = mode;
  document.getElementById('mode_compass').classList.toggle('on', mode==='compass');
  document.getElementById('mode_qibla').classList.toggle('on', mode==='qibla');
  document.getElementById('qibla_tag').style.display = mode==='qibla' ? 'block' : 'none';
  document.getElementById('compass_needle').innerText = mode==='qibla' ? '⬆️' : '🧭';
  document.getElementById('compass_result').innerText = '';
  if(mode==='qibla' && qiblaBearing===null) locateForQibla();
}
function locateForQibla(){
  if(!navigator.geolocation) return document.getElementById('compass_result').innerText = 'Location not supported.';
  navigator.geolocation.getCurrentPosition(pos=>{
    const lat1 = pos.coords.latitude * Math.PI/180, lon1 = pos.coords.longitude * Math.PI/180;
    const lat2 = 21.4225 * Math.PI/180, lon2 = 39.8262 * Math.PI/180; // Kaaba, Mecca
    const dLon = lon2 - lon1;
    const y = Math.sin(dLon) * Math.cos(lat2);
    const x = Math.cos(lat1)*Math.sin(lat2) - Math.sin(lat1)*Math.cos(lat2)*Math.cos(dLon);
    let brng = Math.atan2(y, x) * 180/Math.PI;
    qiblaBearing = (brng + 360) % 360;
    document.getElementById('compass_result').innerText = `Qibla bearing: ${Math.round(qiblaBearing)}° from North`;
  }, ()=>{ document.getElementById('compass_result').innerText = 'Location permission denied.'; });
}
function startCompass(){
  if(compassMode==='qibla' && qiblaBearing===null) locateForQibla();
  function handler(e){
    const heading = e.webkitCompassHeading!==undefined ? e.webkitCompassHeading : (360 - (e.alpha||0));
    let show = heading, label = Math.round(heading)+'° (facing North reference)';
    if(compassMode==='qibla' && qiblaBearing!==null){
      show = qiblaBearing - heading;
      label = `Rotate until arrow points up — that's Qibla (${Math.round(qiblaBearing)}° from North)`;
    }
    document.getElementById('compass_needle').style.transform = `rotate(${show}deg)`;
    document.getElementById('compass_needle').innerText = compassMode==='qibla' ? '🕋⬆️' : '🧭';
    document.getElementById('compass_result').innerText = label;
  }
  if(typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function'){
    DeviceOrientationEvent.requestPermission().then(res=>{
      if(res==='granted') window.addEventListener('deviceorientation', handler);
      else document.getElementById('compass_result').innerText = 'Permission denied.';
    });
  } else if('DeviceOrientationEvent' in window){
    window.addEventListener('deviceorientationabsolute', handler, true);
    window.addEventListener('deviceorientation', handler, true);
  } else {
    document.getElementById('compass_result').innerText = 'Not supported on this device/browser.';
  }
}

function doAge(){

function doGst(){
  const amt = +document.getElementById('gc_amt').value, rate = +document.getElementById('gc_rate').value;
  const mode = document.getElementById('gc_mode').value;
  let base, gst, total;
  if(mode==='add'){ gst = amt*rate/100; total = amt+gst; base=amt; }
  else { base = amt/(1+rate/100); gst = amt-base; total = amt; }
  document.getElementById('gc_result').innerText = `Base: ₹${base.toFixed(2)} · GST: ₹${gst.toFixed(2)} · Total: ₹${total.toFixed(2)}`;

function doCgpa(){
  const pts = document.getElementById('cg_points').value.split(',').map(x=>parseFloat(x.trim())).filter(x=>!isNaN(x));
  const crd = document.getElementById('cg_credits').value.split(',').map(x=>parseFloat(x.trim())).filter(x=>!isNaN(x));
  if(!pts.length || pts.length !== crd.length) return document.getElementById('cg_result').innerText = 'Enter the same number of grade points and credits, comma separated.';
  let sumPC = 0, sumC = 0;
  for(let i=0;i<pts.length;i++){ sumPC += pts[i]*crd[i]; sumC += crd[i]; }
  const cgpa = sumPC/sumC;
  document.getElementById('cg_result').innerText = `CGPA: ${cgpa.toFixed(2)}  (Σ grade×credit = ${sumPC.toFixed(1)}, Σ credit = ${sumC})`;
}

const TM_API = "https://www.1secmail.com/api/v1/";
const TM_FALLBACK_DOMAINS = ["1secmail.com","1secmail.org","1secmail.net","wwjmp.com","esiix.com","xojxe.com","yoggm.com"];
const TM_STORAGE_KEY = "tm_session_v2";
let tmLogin = null, tmDomain = null, tmHidden = [], tmMessages = [], tmPollTimer = null, tmBusy = false;

function tmRandomString(len){
  const chars = "abcdefghijklmnopqrstuvwxyz0123456789";
  let out = "";
  for(let i=0;i<len;i++) out += chars[Math.floor(Math.random()*chars.length)];
  return out;
}
function tmSave(){
  try{ localStorage.setItem(TM_STORAGE_KEY, JSON.stringify({login:tmLogin, domain:tmDomain, hidden:tmHidden})); }catch(e){}
}
function tmLoad(){
  try{ const raw = localStorage.getItem(TM_STORAGE_KEY); return raw ? JSON.parse(raw) : null; }catch(e){ return null; }
}
function tmSetStatus(text, isErr){
  const el = document.getElementById('tm_status');

async function tmPickDomain(){
  try{
    const res = await fetch(`${TM_API}?action=getDomainList`);
    const list = await res.json();
    if(Array.isArray(list) && list.length) return list[Math.floor(Math.random()*list.length)];
  }catch(e){ /* fall through to fallback list */ }
  return TM_FALLBACK_DOMAINS[Math.floor(Math.random()*TM_FALLBACK_DOMAINS.length)];
}

async function tmNewAddress(){
  tmStopPolling();
  tmMessages = []; tmHidden = [];
  document.getElementById('tm_otp')?.classList.remove('show');
  tmRenderMessages();
  const addrInput = document.getElementById('tm_addr');
  if(addrInput) addrInput.value = "Generating your inbox…";
  tmSetStatus("");
  const domain = await tmPickDomain();
  tmLogin = tmRandomString(10);
  tmDomain = domain;
  tmSave();
  if(addrInput) addrInput.value = `${tmLogin}@${tmDomain}`;
  tmSetStatus("Ready. This address is yours until you replace it.");
  tmFetchMessages();
  tmStartPolling();
}

function tmInit(){
  const saved = tmLoad();
  if(saved && saved.login && saved.domain){
    tmLogin = saved.login; tmDomain = saved.domain; tmHidden = saved.hidden || [];
    const addrInput = document.getElementById('tm_addr');
    if(addrInput) addrInput.value = `${tmLogin}@${tmDomain}`;
    tmSetStatus("Restored your last inbox.");
    tmFetchMessages();
    tmStartPolling();
  }else{
    tmNewAddress();
  }
}

function tmStartPolling(){
  tmStopPolling();
  tmSetLive(true);
  tmPollTimer = setInterval(()=>tmFetchMessages(false), 5000);
}
function tmStopPolling(){
  if(tmPollTimer){ clearInterval(tmPollTimer); tmPollTimer = null; }
  tmSetLive(false);
}

function tmExtractOtp(text){
  if(!text) return null;
  const m = text.match(/\b\d{4,8}\b/);
  return m ? m[0] : null;
}
function tmEscape(str){
  const d = document.createElement('div');
  d.textContent = str == null ? "" : String(str);
  return d.innerHTML;
}
function tmTimeAgo(iso){
  const diff = Math.max(0, Date.now() - new Date(iso).getTime());
  const mins = Math.floor(diff/60000);
  if(mins < 1) return "just now";
  if(mins < 60) return mins + "m ago";
  return Math.floor(mins/60) + "h ago";
}

async function tmFetchMessages(manual){
  if(!tmLogin || !tmDomain || tmBusy) return;
  tmBusy = true;
  if(manual) tmSetStatus("Checking…");
  try{
    const res = await fetch(`${TM_API}?action=getMessages&login=${tmLogin}&domain=${tmDomain}`);
    if(!res.ok) throw new Error("Network error " + res.status);
    const list = await res.json();
    const prevIds = new Set(tmMessages.map(m=>m.id));
    tmMessages = (Array.isArray(list) ? list : [])
      .filter(m => !tmHidden.includes(m.id))
      .map(m => ({ id:m.id, from:m.from, subject:m.subject || "(no subject)", date:m.date, bodyLoaded:false, body:"" }))
      .sort((a,b)=> b.id - a.id);
    tmRenderMessages();
    const latest = tmMessages[0];
    if(latest && !prevIds.has(latest.id)){
      const otp = tmExtractOtp(latest.subject);
      if(otp) tmShowOtp(otp);
    }
    if(manual) tmSetStatus("Inbox is up to date.");
  }catch(e){
    tmSetStatus("Couldn't reach the mail server — will retry automatically.", true);
  }finally{
    tmBusy = false;
  }
}

function tmShowOtp(code){
  const banner = document.getElementById('tm_otp');
  const codeEl = document.getElementById('tm_otp_code');
  if(!banner || !codeEl) return;
  codeEl.textContent = code;
  banner.classList.remove('show'); void banner.offsetWidth; banner.classList.add('show');
}

function tmRenderMessages(){
  const list = document.getElementById('tm_list');
  const count = document.getElementById('tm_msgcount');
  if(!list) return;
  if(count) count.textContent = tmMessages.length ? `${tmMessages.length} message${tmMessages.length>1?'s':''}` : "";
  if(!tmMessages.length){
    list.innerHTML = `<div class="tm-empty"><span class="tm-emoji">📭</span>No mail yet — paste the address above wherever you need it.</div>`;
    return;
  }
  list.innerHTML = "";
  tmMessages.forEach(msg=>{
    const card = document.createElement('div');
    card.className = "tm-msg";
    card.innerHTML = `
      <div class="tm-msg-top">
        <span class="tm-msg-from">${tmEscape(msg.from)}</span>
        <span class="tm-msg-time">${tmTimeAgo(msg.date)}</span>
      </div>
      <div class="tm-msg-subj">${tmEscape(msg.subject)}</div>
      <div class="tm-msg-body">${msg.bodyLoaded ? tmEscape(msg.body) : "Loading…"}</div>
      <div class="tm-msg-actions"><button class="tm-del" data-id="${msg.id}">Delete</button></div>`;
    card.addEventListener('click', (e)=>{
      if(e.target.classList.contains('tm-del')) return;
      card.classList.toggle('open');
      if(card.classList.contains('open') && !msg.bodyLoaded) tmOpenMessage(msg, card);
    });
    card.querySelector('.tm-del').addEventListener('click', (e)=>{ e.stopPropagation(); tmDeleteMessage(msg.id); });
    list.appendChild(card);
  });
}

async function tmOpenMessage(msg, card){
  try{
    const res = await fetch(`${TM_API}?action=readMessage&login=${tmLogin}&domain=${tmDomain}&id=${msg.id}`);
    const full = await res.json();
    msg.body = full.textBody || full.body || full.htmlBody?.replace(/<[^>]+>/g,' ') || "(empty message)";
    msg.bodyLoaded = true;
    const bodyEl = card.querySelector('.tm-msg-body');
    if(bodyEl) bodyEl.textContent = msg.body;
    const otp = tmExtractOtp(msg.subject) || tmExtractOtp(msg.body);
    if(otp) tmShowOtp(otp);
  }catch(e){
    tmSetStatus("Couldn't load that message.", true);
  }
}

function tmDeleteMessage(id){
  tmHidden.push(id);
  tmMessages = tmMessages.filter(m => m.id !== id);
  tmSave();
  tmRenderMessages();
  tmSetStatus("Message removed.");
}

function tmCopyAddress(){
  if(!tmLogin || !tmDomain) return;
  const btn = document.getElementById('tm_copybtn');
  navigator.clipboard.writeText(`${tmLogin}@${tmDomain}`).then(()=>{
    if(btn){
      btn.classList.add('copied'); btn.textContent = '✓';
      setTimeout(()=>{ btn.classList.remove('copied'); btn.textContent = '⧉'; }, 1300);
    }
  }).catch(()=> tmSetStatus("Couldn't copy — select and copy the address manually.", true));
}

/* ----- Passport Photo Print Sheet ----- */
const PP_MM_W = 35, PP_MM_H = 45; // Indian standard passport photo size
const PP_SHEETS = {
  "4x6": { wIn:4, hIn:6 },
  "5x7": { wIn:5, hIn:7 },
  "a4":  { wIn:8.27, hIn:11.69 },
};
const PP_DPI = 300;
let ppPhotoDataUrl = null;
let ppCols = 0, ppRows = 0, ppFilled = [];
let ppDragMode = null; // true = filling, false = clearing

function ppInit(){
  ppPhotoDataUrl = null;
  document.getElementById('pp2_result').innerHTML = "";
  ppBuildGrid();
}

function ppLoadPhoto(evt){
  const file = evt.target.files[0];
  if(!file) return;
  const W = Math.round(PP_MM_W/25.4*PP_DPI), H = Math.round(PP_MM_H/25.4*PP_DPI);
  const img = new Image();
  const reader = new FileReader();
  reader.onload = e=>{
    img.onload = ()=>{
      const canvas = document.createElement('canvas');
      canvas.width = W; canvas.height = H;
      const ctx = canvas.getContext('2d');
      const scale = Math.max(W/img.width, H/img.height);
      const sw = W/scale, sh = H/scale;
      const sx = (img.width-sw)/2, sy = (img.height-sh)/2;
      ctx.drawImage(img, sx, sy, sw, sh, 0, 0, W, H);
      ppPhotoDataUrl = canvas.toDataURL('image/jpeg', 0.95);
      document.getElementById('pp2_result').innerHTML = `<span style="color:var(--cyan-dark);font-weight:600;">Photo ready — now drag across the sheet below.</span>`;
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function ppBuildGrid(){
  const sheetKey = document.getElementById('pp2_sheet')?.value || "4x6";
  const sheet = PP_SHEETS[sheetKey];
  const tileWpx = PP_MM_W/25.4*PP_DPI, tileHpx = PP_MM_H/25.4*PP_DPI;
  const sheetWpx = sheet.wIn*PP_DPI, sheetHpx = sheet.hIn*PP_DPI;
  ppCols = Math.max(1, Math.floor(sheetWpx/tileWpx));
  ppRows = Math.max(1, Math.floor(sheetHpx/tileHpx));
  ppFilled = new Array(ppCols*ppRows).fill(false);

  const grid = document.getElementById('pp2_sheet_grid');
  const displayW = 260; // on-screen width in px, scaled down from true print size
  const displayH = displayW * (sheetHpx/sheetWpx);
  grid.style.width = displayW + "px";
  grid.style.height = displayH + "px";
  grid.style.gridTemplateColumns = `repeat(${ppCols}, 1fr)`;
  grid.style.gridTemplateRows = `repeat(${ppRows}, 1fr)`;
  grid.innerHTML = "";

  for(let i=0;i<ppCols*ppRows;i++){
    const cell = document.createElement('div');
    cell.className = "pp-cell";
    cell.dataset.idx = i;
    cell.addEventListener('pointerdown', (e)=>{
      e.preventDefault();
      ppDragMode = !ppFilled[i];
      ppSetCell(i, ppDragMode, cell);
      grid.setPointerCapture(e.pointerId);
    });
    cell.addEventListener('pointerenter', ()=>{
      if(ppDragMode !== null) ppSetCell(i, ppDragMode, cell);
    });
    grid.appendChild(cell);
  }
  document.addEventListener('pointerup', ()=>{ ppDragMode = null; }, { once:false });
  ppUpdateCount();
}

function ppSetCell(i, fill, cellEl){
  if(fill && !ppPhotoDataUrl){
    tmSetStatusSafe();
    document.getElementById('pp2_result').innerHTML = `<span style="color:var(--pink-dark);font-weight:600;">Upload a photo first.</span>`;
    return;
  }
  ppFilled[i] = fill;
  const cell = cellEl || document.querySelector(`.pp-cell[data-idx="${i}"]`);
  if(cell){
    cell.classList.toggle('filled', fill);
    cell.style.backgroundImage = fill ? `url(${ppPhotoDataUrl})` : "";
  }
  ppUpdateCount();
}
function tmSetStatusSafe(){ /* no-op guard so ppSetCell never throws if tm tool isn't mounted */ }

function ppUpdateCount(){
  const n = ppFilled.filter(Boolean).length;
  const el = document.getElementById('pp2_count');
  if(el) el.innerHTML = `<b>${n}</b> of ${ppCols*ppRows} slots filled`;
}

function ppDownload(){
  if(!ppPhotoDataUrl){
    document.getElementById('pp2_result').innerHTML = `<span style="color:var(--pink-dark);font-weight:600;">Upload a photo first.</span>`;
    return;
  }
  const sheetKey = document.getElementById('pp2_sheet')?.value || "4x6";
  const sheet = PP_SHEETS[sheetKey];
  const tileW = Math.round(PP_MM_W/25.4*PP_DPI), tileH = Math.round(PP_MM_H/25.4*PP_DPI);
  const sheetWpx = Math.round(sheet.wIn*PP_DPI), sheetHpx = Math.round(sheet.hIn*PP_DPI);
  const marginX = Math.round((sheetWpx - ppCols*tileW)/(ppCols+1));
  const marginY = Math.round((sheetHpx - ppRows*tileH)/(ppRows+1));

  const canvas = document.createElement('canvas');
  canvas.width = sheetWpx; canvas.height = sheetHpx;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = "#fff";
  ctx.fillRect(0,0,sheetWpx,sheetHpx);

  const img = new Image();
  img.onload = ()=>{
    for(let r=0;r<ppRows;r++){
      for(let c=0;c<ppCols;c++){
        const idx = r*ppCols+c;
        if(!ppFilled[idx]) continue;
        const x = marginX + c*(tileW+marginX);
        const y = marginY + r*(tileH+marginY);
        ctx.drawImage(img, x, y, tileW, tileH);
        ctx.strokeStyle = "#bbb"; ctx.setLineDash([4,3]);
        ctx.strokeRect(x, y, tileW, tileH);
        ctx.setLineDash([]);
      }
    }
    const link = document.createElement('a');
    link.href = canvas.toDataURL('image/png');
    link.download = `passport-print-sheet-${sheetKey}.png`;
    link.click();
    document.getElementById('pp2_result').innerHTML = `<span style="color:var(--cyan-dark);font-weight:600;">Sheet downloaded — dashed lines mark where to cut.</span>`;
  };
  img.src = ppPhotoDataUrl;
}
</script>
